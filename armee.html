<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a09">
<title>Armee</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Cinzel:wght@600;700&display=swap">
<style>
:root { --ink: #0b0a09; --ink2: #16130f; --panel: #1c1813; --ivory: #f2ead8; --dim: #b3a88f; --au: #d6b25e; --au-lo: rgba(214, 178, 94, .35);
  --p0: #f0a336; --p1: #4fb4ff; --bad: #ff5a4e; --good: #5fe08f; --wood: #e8c88c; --wood2: #c9a062; --fs: 16px; }
html.big { --fs: 20px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--ink); color: var(--ivory); font: 500 var(--fs)/1.35 system-ui, 'Segoe UI', sans-serif; }
body { min-height: 100vh; display: flex; justify-content: center; }
#app { width: 100%; max-width: 620px; padding: 8px 10px calc(16px + env(safe-area-inset-bottom)); }
h1, h2 { font-family: Cinzel, serif; color: var(--au); margin: .3em 0; } h1 { font-size: 1.7em; text-align: center; } h2 { font-size: 1.2em; }
.hidden { display: none !important; }
button, a.btn { font: inherit; color: inherit; cursor: pointer; }
.btn { background: linear-gradient(180deg, #3a3126, #221d17); border: 1px solid var(--au-lo); border-radius: 12px; padding: .65em 1em; min-height: 48px; font-weight: 700; }
.btn:active { transform: translateY(1px); } .btn:disabled { opacity: .4; cursor: default; }
.btn.on { border: 2px solid var(--au); background: linear-gradient(180deg, #5a4826, #3a2e18); color: #ffe7a8; }
.btn.go { background: linear-gradient(180deg, #b8322a, #6e1511); border-color: #ff8a70; }
.btn.small { min-height: 40px; padding: .35em .7em; font-size: .9em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; }
.menu { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 18px auto; }
.note { color: var(--dim); font-size: .9em; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0 8px; }
.bar .ttl { font-family: Cinzel, serif; color: var(--au); font-weight: 700; }
.gold { color: #ffd76a; font-weight: 800; }
.stage { text-align: center; font-weight: 800; padding: 6px; border-radius: 10px; background: var(--ink2); border: 1px solid var(--au-lo); margin-bottom: 8px; }
/* Brett */
#boardWrap { position: relative; width: 100%; aspect-ratio: 1; touch-action: manipulation; }
#board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); background: #6b4f2a; border: 3px solid #3d2a14; border-radius: 6px; }
.cell { border: 1px solid rgba(40, 24, 8, .55); background: #c79c5a; position: relative; }
.cell.zone0 { background: #d1a865; } .cell.zone1 { background: #bf9150; }
.cell.ok { background: #8fd18b; box-shadow: inset 0 0 0 2px #2f8a3a; }
.cell.hit { box-shadow: inset 0 0 0 3px rgba(255, 70, 50, .85); }
.cell.danger { background-image: linear-gradient(rgba(255, 60, 40, .22), rgba(255, 60, 40, .22)); }
.cell.reach { background-image: radial-gradient(circle, rgba(255, 70, 50, .45) 20%, transparent 24%); }
#units, #fx { position: absolute; inset: 3px; pointer-events: none; }
/* 3D-Schlachtfeld (js/armee/view3d.js): liegt in der Schlacht über dem Brett, etwas höher als breit */
#boardWrap.d3 { aspect-ratio: 4 / 5; }
#v3d { position: absolute; inset: 0; z-index: 4; border-radius: 6px; overflow: hidden; background: #2a2418; }
#v3d .v3-gl, #v3d .v3-ov, #v3d .v3-still { position: absolute; inset: 0; }
#v3d .v3-still { width: 100%; height: 100%; }
#v3d .v3-ov { pointer-events: none; }
.v3-hp { position: absolute; left: 0; top: 0; width: 24px; height: 4px; background: rgba(0,0,0,.55); border-radius: 2px; will-change: transform; }
.v3-hp.king { width: 38px; height: 5px; }
.v3-hp i { display: block; height: 100%; border-radius: 2px; transition: width .4s; }
.v3-hp.p0 i { background: #ff9a3c; } .v3-hp.p1 i { background: #5cb8ff; }
.v3-dmg { position: absolute; transform: translate(-50%, -50%); font: 700 15px sans-serif; color: #ffe0a0; text-shadow: 0 1px 3px #000, 0 0 2px #000; animation: v3up 1.1s ease-out forwards; }
.v3-dmg.promo { color: #ffd36a; font-size: 14px; }
@keyframes v3up { to { transform: translate(-50%, -190%); opacity: 0; } }
.u { position: absolute; width: calc(100% / 9); height: calc(100% / 9); transition: transform var(--mv, 300ms) ease, opacity .35s; display: flex; align-items: center; justify-content: center; }
.u .k { position: relative; width: 82%; height: 84%; background: linear-gradient(180deg, var(--wood), var(--wood2)); clip-path: polygon(50% 0, 86% 14%, 100% 100%, 0 100%, 14% 14%); display: flex; align-items: center; justify-content: center; }
.u.down .k { transform: rotate(180deg); }
.u .k::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 13%; background: var(--team); }
.u.p0 { --team: var(--p0); } .u.p1 { --team: var(--p1); }
.u .kj { width: 100%; height: 92%; background: #1b1209; -webkit-mask: var(--km) center / contain no-repeat; mask: var(--km) center / contain no-repeat; margin-top: 6%; }
.u.pro .kj { background: #c41e1e; }
.u .tx { font-weight: 900; font-size: calc(var(--cell) * .3); color: #1b1209; margin-top: 10%; letter-spacing: -.5px; }
.u.pro .tx { color: #c41e1e; }
.u.down .tx { transform: rotate(180deg); margin-top: 0; margin-bottom: 10%; }
.u .hp { position: absolute; left: 8%; right: 8%; bottom: 2%; height: 9%; background: rgba(0, 0, 0, .65); border-radius: 3px; overflow: hidden; }
.u .hp i { display: block; height: 100%; background: var(--team); transition: width .25s; }
.u .lv { position: absolute; top: 0; right: 2%; font-size: calc(var(--cell) * .22); color: #ffe27a; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.u .hold { position: absolute; top: 0; left: 2%; font-size: calc(var(--cell) * .22); text-shadow: 0 0 2px #000; }
.u.sel .k { outline: none; filter: drop-shadow(0 0 0 #fff) brightness(1.15); }
.u.sel::after { content: ''; position: absolute; inset: 1px; border: 3px solid #fff; border-radius: 7px; box-shadow: 0 0 8px #fff; z-index: 3; }
.u.new::before { content: 'neu'; position: absolute; top: -2%; left: 50%; transform: translateX(-50%); z-index: 2; font-size: calc(var(--cell) * .2); font-weight: 800; background: var(--good); color: #062; border-radius: 4px; padding: 0 3px; line-height: 1.2; }
.u.dead { opacity: 0; transform-origin: center; }
.u.dead .k { scale: .5; rotate: 25deg; transition: scale .4s, rotate .4s; }
.u .k { transition: translate var(--mv, 300ms) cubic-bezier(.3, 1.6, .5, 1); }
.u.bump .k { translate: var(--bx, 0) var(--by, 0); }
@keyframes shake { 0%, 100% { margin-left: 0; } 25% { margin-left: -7%; } 75% { margin-left: 7%; } }
.u.promo .k { animation: glow 1.2s; }
@keyframes glow { 0% { filter: brightness(2.5) drop-shadow(0 0 10px #ffd76a); } 100% { filter: none; } }
.puff { position: absolute; width: calc(var(--cell) * .9); height: calc(var(--cell) * .9); transform: translate(-50%, -50%) scale(.3); border-radius: 50%; background: radial-gradient(circle, rgba(230, 210, 170, .85), rgba(120, 100, 70, .35) 55%, transparent 70%); animation: puff .8s ease-out forwards; pointer-events: none; }
.puff.gold { background: radial-gradient(circle, rgba(255, 225, 120, .95), rgba(255, 180, 40, .4) 55%, transparent 70%); }
@keyframes puff { to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }
.u.flash .k { filter: brightness(2.2) saturate(.3); animation: shake .32s; }
.dmg { position: absolute; font-weight: 900; color: #ff4b3e; text-shadow: 0 0 3px #000, 0 0 3px #000; font-size: calc(var(--cell) * .38); animation: up .9s forwards; pointer-events: none; transform: translate(-50%, -50%); }
@keyframes up { to { margin-top: calc(var(--cell) * -.6); opacity: 0; } }
#fx svg { width: 100%; height: 100%; position: absolute; inset: 0; overflow: visible; }
/* Laden, Hand */
.shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
.card { background: var(--panel); border: 2px solid #3a3023; border-radius: 10px; padding: 4px 2px 6px; text-align: center; min-height: 48px; }
.card.sel { border-color: #fff; background: #2b241a; box-shadow: 0 0 8px rgba(255,255,255,.5); } .card.sold { opacity: .3; } .card.sold .cc { color: var(--dim); } .card.poor { opacity: .5; }
.card .ck { height: 34px; display: flex; justify-content: center; }
.card .ck i { width: 34px; height: 34px; background: var(--ivory); -webkit-mask: var(--km) center / contain no-repeat; mask: var(--km) center / contain no-repeat; }
.card .cn { font-size: .78em; font-weight: 700; } .card .cc { font-size: .85em; }
.hand { display: flex; gap: 6px; flex-wrap: wrap; min-height: 10px; }
.hand .card { flex: 0 0 auto; padding: 4px 8px; min-width: 64px; }
.lbl { font-size: .85em; color: var(--dim); margin: 6px 0 2px; font-weight: 700; }
/* Info-Karte */
.info { background: var(--panel); border: 1px solid var(--au); border-radius: 12px; padding: 10px 34px 10px 10px; margin: 8px 0; display: flex; gap: 12px; align-items: flex-start; position: sticky; bottom: 64px; z-index: 6; box-shadow: 0 -6px 18px rgba(0, 0, 0, .6); }
.info .x { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border: 0; background: none; color: var(--dim); font-size: 20px; }
#ctrl-plan { flex-wrap: nowrap; } #ctrl-plan .btn.small { padding: .3em .45em; font-size: .82em; white-space: nowrap; } #ctrl-plan .btn.go { flex: 1; min-height: 44px; }
.info .stats { flex: 1; } .info .nm { font-weight: 800; font-size: 1.1em; }
.pat { display: grid; grid-template-columns: repeat(5, 18px); grid-template-rows: repeat(5, 18px); gap: 2px; flex: none; }
.pat b { background: #2a241c; border-radius: 3px; } .pat b.c { background: var(--ivory); } .pat b.s { background: #ff6a4e; } .pat b.l { background: #ff6a4e; opacity: .6; } .pat b.j { background: #ffb347; }
.log { background: var(--ink2); border: 1px solid #2c261d; border-radius: 10px; padding: 8px; max-height: 9.5em; overflow: auto; font-size: .88em; }
.log div { padding: 1px 0; } .log .t { color: var(--dim); }
.ctrl { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .78); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--au); border-radius: 14px; padding: 16px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; }
.box ul { padding-left: 1.2em; margin: .4em 0; } .box li { margin: .25em 0; }
.cover { position: fixed; inset: 0; background: var(--ink); z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; }
.sum div { margin: 3px 0; }
#intro .box { background: var(--panel); border: 1px solid var(--au); border-radius: 14px; padding: 18px; max-width: 460px; width: 100%; max-height: 92vh; overflow: auto; }
.big-k { font: 900 64px/1 'Noto Serif JP', serif; color: var(--au); text-align: center; margin: 4px 0 -4px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #4a3f30; } .dots i.on { background: var(--au); }
.mini { display: grid; grid-template-columns: repeat(5, 26px); gap: 2px; margin: 8px auto; width: max-content; background: #6b4f2a; padding: 3px; border-radius: 4px; }
.mini b { background: #c79c5a; } .mini b.o { background: var(--p0); } .mini b.x { background: var(--p1); } .mini b.z { background: #8fd18b; } .mini b.k { background: #fff; box-shadow: inset 0 0 0 4px var(--p0); } .mini b:first-child ~ b.k:nth-child(-n+5) { box-shadow: inset 0 0 0 4px var(--p1); }
.sides { margin: -4px 0 6px; line-height: 1.35; font-size: .85em; }
.p0c { color: var(--p0); font-weight: 800; } .p1c { color: var(--p1); font-weight: 800; }
</style>
</head>
<body>
<div id="app">
  <section id="scr-menu">
    <h1>Armee</h1>
    <p class="note" style="text-align:center">Kaufen, aufstellen, Befehle geben – die Schlacht läuft von selbst</p>
    <div class="menu">
      <button class="btn go hidden" id="m-resume">Weiterspielen</button>
      <button class="btn" id="m-ki">Übungspartie gegen KI</button>
      <button class="btn" id="m-net">Online gegen ein zweites Handy</button>
      <div class="row" id="m-netlist"></div>
      <button class="btn" id="m-hot">Zu zweit an einem Gerät</button>
      <div class="row"><button class="btn small grow" id="m-intro">Einführung</button><button class="btn small grow" id="m-rules">Regeln</button></div>
      <div class="row"><button class="btn small grow" id="m-big">Große Schrift: aus</button><button class="btn small grow" id="m-lab">Beschriftung: Kanji</button><button class="btn small grow" id="m-snd">Ton: an</button></div>
      <button class="btn small" id="m-lvl">KI-Stärke: mittel</button>
      <button class="btn small" id="m-hc">Vorgabe zu zweit: keine</button>
      <button class="btn small" id="m-clock">Rundenuhr online: aus</button>
      <button class="btn small" id="m-3d">3D-Schlachtfeld: an</button>
      <button class="btn small" id="m-react">Reaktionspause: an</button>
      <a class="btn small" href="index.html" style="text-align:center;text-decoration:none">Zurück zum Shogi-Menü</a>
    </div>
  </section>

  <section id="scr-game" class="hidden">
    <div class="bar">
      <button class="btn small" id="g-menu">☰</button>
      <div class="ttl" id="g-round">Runde 1</div>
      <div><span id="g-who"></span> · <span class="gold" id="g-gold">0</span> Gold</div>
      <button class="btn small" id="g-help">?</button>
    </div>
    <div class="stage" id="g-stage">Planung</div>
    <div class="sides note hidden" id="g-net"></div>
    <div class="sides note" id="g-sides"></div>
    <div id="boardWrap"><div id="board"></div><div id="units"></div><div id="fx"></div><div id="v3d" class="hidden"></div></div>

    <div id="pane-plan">
      <div class="lbl" id="lbl-shop">Laden <span class="note">(tippen, dann Feld in deinen 3 Reihen)</span></div>
      <div class="shop" id="shop"></div>
      <div class="row"><button class="btn small" id="b-reroll">Neue Angebote (1 Gold)</button><span class="note grow" id="dropinfo"></span></div>
      <div class="lbl">Überläufer <span class="note">(geschlagene Gegner, halber Preis, in deiner Hälfte)</span></div>
      <div class="hand" id="hand"></div>
    </div>
    <div id="info" class="info hidden"></div>
    <div class="ctrl" id="ctrl-plan" style="position:sticky;bottom:0;background:var(--ink);padding:6px 0;z-index:5">
      <button class="btn small" id="b-undo">↶ Zurück</button>
      <button class="btn small" id="b-danger" title="Felder, die der Gegner angreifen kann">⚠ Gefahr</button>
      <button class="btn small" id="b-probe">Probelauf</button>
      <button class="btn go" id="b-done">Fertig</button>
    </div>
    <div class="ctrl hidden" id="ctrl-play">
      <button class="btn small" id="p-pause">⏸ Pause</button>
      <button class="btn small" id="p-step">Schritt ▸</button>
      <button class="btn small" id="p-speed">Tempo 1×</button>
      <button class="btn small" id="p-skip">Überspringen ⏭</button>
    </div>
    <div class="lbl">Schlachtbericht</div>
    <div class="log" id="log"></div>
    <div style="height:40px"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="cover" class="cover hidden"></div>
<div id="intro" class="modal hidden" style="z-index:30"></div>
<script type="importmap">{ "imports": { "three": "./js/vendor/three-shim.js" } }</script>
<script>window.Models = { ready: function (cb) { (window.__modelsWaiting = window.__modelsWaiting || []).push(cb); } };</script>
<script src="js/net.js?v=202610212214"></script>
<script src="js/armee/engine.js?v=202610212214"></script>
<script src="js/armee/bot.js?v=202610212214"></script>
<script src="js/armee/view3d.js?v=202610212214"></script>
<script src="js/armee/ui.js?v=202610212214"></script>
</body>
</html>
