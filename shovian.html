<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0a09">
<title>Shovian</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Cinzel:wght@600;700&display=swap">
<style>
:root { --ink: #0b0a09; --ink2: #16130f; --panel: #1c1813; --ivory: #f2ead8; --dim: #b3a88f; --au: #d6b25e; --au-lo: rgba(214, 178, 94, .35);
  --p0: #d8432f; --p1: #3f8fd8; --bad: #ff5a4e; --good: #5fe08f; --wood: #ead2a0; --wood2: #c9a062; --fs: 16px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--ink); color: var(--ivory); font: 500 var(--fs)/1.35 system-ui, 'Segoe UI', sans-serif; }
body { min-height: 100vh; display: flex; justify-content: center; }
#app { width: 100%; max-width: 620px; padding: 8px 10px calc(16px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: Cinzel, serif; color: var(--au); margin: .3em 0; } h1 { font-size: 1.7em; text-align: center; } h2 { font-size: 1.2em; } h3 { font-size: 1em; }
.hidden { display: none !important; }
.warn { color: #ff9a3c; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { background: linear-gradient(180deg, #3a3126, #221d17); border: 1px solid var(--au-lo); border-radius: 12px; padding: .65em 1em; min-height: 48px; font-weight: 700; }
.btn:active { transform: translateY(1px); } .btn:disabled { opacity: .4; cursor: default; }
.btn.on { border: 2px solid var(--au); background: linear-gradient(180deg, #5a4826, #3a2e18); color: #ffe7a8; }
.btn.go { background: linear-gradient(180deg, #b8322a, #6e1511); border-color: #ff8a70; }
.btn.small { min-height: 40px; padding: .35em .7em; font-size: .9em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .grow { flex: 1; }
.menu { display: flex; flex-direction: column; gap: 10px; max-width: 420px; margin: 14px auto; }
.menu .btn { text-align: left; } .menu .btn small { display: block; font-weight: 500; color: var(--dim); font-size: .82em; }
.note { color: var(--dim); font-size: .9em; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0 8px; }
.stage { text-align: center; font-weight: 800; padding: 6px; border-radius: 10px; background: var(--ink2); border: 1px solid var(--au-lo); margin-bottom: 8px; }
.stage.s0 { border-color: var(--p0); } .stage.s1 { border-color: var(--p1); }
.meta { display: flex; justify-content: space-between; font-size: .85em; color: var(--dim); margin: 0 2px 6px; gap: 8px; }
.meta b.s0 { color: #ff9b86; } .meta b.s1 { color: #8cc6ff; }
/* Brett */
#boardWrap { position: relative; width: 100%; aspect-ratio: 1; touch-action: manipulation; }
#board { position: absolute; inset: 0; display: grid; background: #5d4424; border: 3px solid #3d2a14; border-radius: 6px; }
.cell { border: 1px solid rgba(40, 24, 8, .55); background: #c79c5a; position: relative; }
.cell.zone0 { background: #d4a868; } .cell.zone1 { background: #b88d52; }
.cell.ok::after { content: ''; position: absolute; left: 50%; top: 50%; width: 26%; height: 26%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(30, 110, 40, .75); }
.cell.atk { box-shadow: inset 0 0 0 3px rgba(230, 40, 30, .95); background-image: linear-gradient(rgba(255, 60, 40, .25), rgba(255, 60, 40, .25)); }
.cell.shoot { box-shadow: inset 0 0 0 3px rgba(255, 150, 30, .95); background-image: radial-gradient(circle, rgba(255, 150, 30, .45) 18%, transparent 22%); }
.cell.peek::after { content: ''; position: absolute; left: 50%; top: 50%; width: 22%; height: 22%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(255, 255, 255, .8); }
.cell.place { background-image: radial-gradient(circle, rgba(255, 255, 255, .35) 14%, transparent 18%); }
.cell .pv { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 800 calc(var(--cell) * .2) system-ui; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; z-index: 6; pointer-events: none; line-height: 1.05; }
.pv small { font-size: .72em; }
.stone { position: absolute; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity .4s; }
.stone .sb { width: 92%; height: 70%; border-radius: 4px; background: repeating-linear-gradient(0deg, #8d8577 0 30%, #6d665a 30% 34%), #8d8577; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .35), 0 2px 3px rgba(0, 0, 0, .5); position: relative; }
.stone .hp { position: absolute; left: 6%; right: 6%; bottom: -14%; height: 12%; background: rgba(0, 0, 0, .65); border-radius: 3px; overflow: hidden; }
.stone .hp i { display: block; height: 100%; background: #d9cdb5; }
.stone.gone { opacity: 0; }
#units, #fx { position: absolute; inset: 3px; pointer-events: none; }
.u { position: absolute; display: flex; align-items: center; justify-content: center; transition: transform 260ms ease, opacity .4s; }
.u .k { position: relative; width: 86%; height: 88%; background: linear-gradient(180deg, var(--wood), var(--wood2)); clip-path: polygon(50% 0, 86% 14%, 100% 100%, 0 100%, 14% 14%); display: flex; align-items: center; justify-content: center; }
.u.s1 .k { clip-path: polygon(0 0, 100% 0, 86% 86%, 50% 100%, 14% 86%); }
.u .k::after { content: ''; position: absolute; left: 0; right: 0; height: 12%; background: var(--team); }
.u.s0 .k::after { bottom: 0; } .u.s1 .k::after { top: 0; }
.u.s0 { --team: var(--p0); } .u.s1 { --team: var(--p1); }
.u svg { width: 54%; height: 54%; color: #2a1a0c; margin-top: 4%; }
.u.s1 svg { margin-top: -6%; }
.u.pro svg { color: #b3121a; }
.u .kj { position: absolute; top: 14%; left: 8%; font: 900 calc(var(--cell) * .17)/1 'Noto Serif JP', serif; color: #5b3a18; }
.u.s1 .kj { top: 18%; } .u.pro .kj { color: #b3121a; }
.u .cnt { position: absolute; right: 2%; bottom: 14%; font: 900 calc(var(--cell) * .21)/1 system-ui; color: #fff; background: var(--team); padding: 1px 3px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); }
.u.s1 .cnt { bottom: 22%; }
.u .hp { position: absolute; left: 10%; right: 10%; bottom: 0; height: 7%; background: rgba(0, 0, 0, .65); border-radius: 3px; overflow: hidden; }
.u .hp i { display: block; height: 100%; background: var(--team); transition: width .3s; }
.u.sel::after { content: ''; position: absolute; inset: 1px; border: 3px solid #fff; border-radius: 7px; box-shadow: 0 0 8px #fff; }
.u.peek::after { content: ''; position: absolute; inset: 1px; border: 2px dashed #fff; border-radius: 7px; }
.u.flash .k { filter: brightness(2.2) saturate(.3); animation: shake .32s; }
@keyframes shake { 0%, 100% { margin-left: 0; } 25% { margin-left: -7%; } 75% { margin-left: 7%; } }
.u.dead { opacity: 0; }
.u.glow .k { animation: glow 1.2s; }
@keyframes glow { 0% { filter: brightness(2.3) drop-shadow(0 0 10px #ffd76a); } 100% { filter: none; } }
.dmg { position: absolute; font-weight: 900; color: #ff4b3e; text-shadow: 0 0 3px #000, 0 0 3px #000; font-size: calc(var(--cell) * .32); animation: up 1.1s forwards; transform: translate(-50%, -50%); white-space: nowrap; }
.dmg.gold { color: #ffd76a; } .dmg.grey { color: #e6dcc6; }
@keyframes up { to { margin-top: calc(var(--cell) * -.7); opacity: 0; } }
.shot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: radial-gradient(circle, #fff3c0, #ff8a20 60%, transparent 70%); transition: transform .35s ease-in; }
.banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10, 8, 6, .85); border: 1px solid var(--au); color: #ffe7a8; font: 700 1.1em Cinzel, serif; padding: 10px 16px; border-radius: 10px; animation: fade 1.8s forwards; white-space: nowrap; z-index: 9; }
@keyframes fade { 0% { opacity: 0; } 15%, 75% { opacity: 1; } 100% { opacity: 0; } }
/* Reserve, Info */
.tray { display: flex; gap: 6px; flex-wrap: wrap; min-height: 48px; padding: 6px; background: var(--ink2); border: 1px dashed #3a3023; border-radius: 10px; margin: 8px 0; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 2px solid #3a3023; border-radius: 10px; padding: 4px 8px 4px 4px; font-size: .85em; font-weight: 700; }
.chip.sel { border-color: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .5); }
.chip i { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, var(--wood), var(--wood2)); border-radius: 6px; }
.chip svg { width: 20px; height: 20px; color: #2a1a0c; }
.info { background: var(--panel); border: 1px solid var(--au); border-radius: 12px; padding: 10px; margin: 8px 0; display: flex; gap: 12px; align-items: flex-start; }
.info .nm { font-weight: 800; font-size: 1.05em; } .info .st { flex: 1; font-size: .9em; } .info .st div { margin: 2px 0; }
.pat { display: grid; grid-template-columns: repeat(5, 16px); grid-template-rows: repeat(5, 16px); gap: 2px; flex: none; }
.pat b { background: #2a241c; border-radius: 3px; } .pat b.c { background: var(--ivory); } .pat b.s { background: #ff6a4e; } .pat b.l { background: #ff6a4e; opacity: .55; } .pat b.r { background: #ffa030; opacity: .7; }
.log { background: var(--ink2); border: 1px solid #2c261d; border-radius: 10px; padding: 8px; max-height: 9em; overflow: auto; font-size: .86em; }
.log div { padding: 1px 0; } .log .s0 { color: #ffb3a4; } .log .s1 { color: #a8d4ff; }
.ctrl { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
/* Eigenes Gefecht */
.side { background: var(--panel); border: 1px solid #3a3023; border-radius: 12px; padding: 10px; margin: 8px 0; }
.side.s0 { border-color: rgba(216, 67, 47, .6); } .side.s1 { border-color: rgba(63, 143, 216, .6); }
.troops { display: grid; grid-template-columns: 1fr 76px; gap: 4px 8px; align-items: center; margin-top: 6px; font-size: .9em; }
.troops input, .side select { background: var(--ink2); color: var(--ivory); border: 1px solid #3a3023; border-radius: 8px; padding: 6px; font: inherit; width: 100%; }
.side select { width: auto; }
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .78); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--au); border-radius: 14px; padding: 16px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; }
.res td { padding: 2px 6px; } .res td:nth-child(n+2) { text-align: right; }
</style>
</head>
<body>
<div id="app">
  <section id="scr-menu">
    <div class="bar"><button class="btn small" onclick="location.href='index.html'">‹ Zurück</button><span class="note">Prototyp</span></div>
    <h1>Shovian</h1>
    <p class="note" style="text-align:center">Shogi × Travian: Nur die Truppen, die du schickst, stehen auf dem Brett. Shogi-Züge, aber jeder Trupp hat Anzahl, Schaden und Leben.</p>
    <div class="menu" id="menu"></div>
    <div class="row" style="justify-content:center"><span class="note">Gegner:</span><button class="btn small on" id="opp-ai">KI</button><button class="btn small" id="opp-hs">Zweiter Spieler (Hot-Seat)</button><button class="btn small" id="opp-prep">Vorbereitete Verteidigung</button></div>
  </section>

  <section id="scr-custom" class="hidden">
    <div class="bar"><button class="btn small" id="c-back">‹ Menü</button><h2>Eigenes Gefecht</h2><span></span></div>
    <div id="c-sides"></div>
    <div class="ctrl"><button class="btn go" id="c-go">Zur Aufstellung</button></div>
  </section>

  <section id="scr-battle" class="hidden">
    <div class="bar"><button class="btn small" id="b-menu">‹ Menü</button><h2 id="b-title">Gefecht</h2><button class="btn small" id="b-help">?</button></div>
    <div class="stage" id="stage"></div>
    <div class="meta" id="meta"></div>
    <div id="boardWrap"><div id="board"></div><div id="units"></div><div id="fx"></div></div>
    <div id="setup">
      <div class="tray" id="tray"></div>
      <div class="ctrl">
        <button class="btn small" id="s-split">Teilen</button>
        <button class="btn small" id="s-back">In Reserve</button>
        <button class="btn small" id="s-auto">Automatisch</button>
        <button class="btn go" id="s-done">Fertig</button>
      </div>
    </div>
    <div id="info" class="info hidden"></div>
    <div class="ctrl"><button class="btn small hidden" id="b-retreat">⚑ Rückzug</button></div>
    <div class="log" id="log"></div>
    <div style="height:30px"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<script src="js/shovian/rules.js?v=202610260032"></script>
<script src="js/shovian/battle.js?v=202610260032"></script>
<script src="js/shovian/ai.js?v=202610260032"></script>
<script src="js/shovian/ui.js?v=202610260032"></script>
</body>
</html>
